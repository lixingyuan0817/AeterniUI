<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aeterni UI</title>
    <base href="/" />
    <script>
        // Pre-paint theme resolution ------------------------------------------
        // Runs before the stylesheets are applied so a dark-preference visitor
        // never sees a light flash. Keep this snippet in sync with
        // ThemeProvider (storage key and the data-theme / data-aeterni-mode
        // attributes are the library contract); the stylesheet also carries a
        // prefers-color-scheme fallback for hosts that skip the snippet.
        (function () {
            const root = document.documentElement;
            const storedMode = (function () {
                try {
                    return window.localStorage?.getItem('aeterni.theme.mode') || null;
                } catch {
                    return null;
                }
            })();
            const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            const theme = storedMode === 'dark' || storedMode === 'light' ? storedMode : systemTheme;

            root.dataset.aeterniMode = theme;
            root.dataset.theme = theme;
            root.style.colorScheme = theme;
        })();

        // Tauri resets the native appearance so the webview keeps following the
        // operating system instead of a previously set native theme.
        if (window.__TAURI__ || window.__TAURI_INTERNALS__) {
            const root = document.documentElement;
            root.dataset.tauriHost = "true";

            const tauri = window.__TAURI__;
            const tauriWindow = tauri?.window?.getCurrentWindow?.();
            const nativeThemeTask = tauri?.app?.setTheme
                ? tauri.app.setTheme(null)
                : tauriWindow?.setTheme
                    ? tauriWindow.setTheme(null)
                    : window.__TAURI_INTERNALS__?.invoke?.('plugin:app|set_app_theme', { theme: null });
            nativeThemeTask?.catch(() => undefined);
        }
    </script>
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="_content/AeterniUI/css/aeterni_ui.css" />
    <link rel="stylesheet" href="_content/AeterniUI/AeterniUI.styles.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link href="AeterniUI.Sample.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
    <script src="js/host-backdrop.js" defer></script>
    <script src="js/startup-recovery.js" defer></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>

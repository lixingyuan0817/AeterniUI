<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aeterni UI</title>
    <base href="/" />
    <script>
        // Pre-paint theme resolution ------------------------------------------
        // Runs before the stylesheets are applied so a dark-preference visitor
        // never sees a light flash, and a green-brand visitor never sees a
        // violet one. Keep this snippet in sync with ThemeProvider (storage keys
        // and the data-theme / data-aeterni-mode / data-aeterni-brand attributes
        // are the library contract); the stylesheet also carries a
        // prefers-color-scheme fallback for hosts that skip the snippet.
        (function () {
            const root = document.documentElement;
            const storedMode = (function () {
                try {
                    return window.localStorage?.getItem('aeterni.theme.mode') || null;
                } catch {
                    return null;
                }
            })();
            const systemTheme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            const theme = storedMode === 'dark' || storedMode === 'light' ? storedMode : systemTheme;

            root.dataset.aeterniMode = theme;
            root.dataset.theme = theme;
            root.style.colorScheme = theme;

            // Brand hue layer. The `'purple'` literal must match
            // AeterniUIOptions.DefaultBrand: this snippet cannot read the .NET
            // option, and the provider applies the option after the first render,
            // so a mismatch shows up as a one-frame colour flash.
            const storedBrand = (function () {
                try {
                    return window.localStorage?.getItem('aeterni.theme.brand') || null;
                } catch {
                    return null;
                }
            })();

            root.dataset.aeterniBrand = storedBrand || 'purple';
        })();
    </script>
    <link rel="preload" id="webassembly" />
    <link rel="stylesheet" href="_content/AeterniUI/css/aeterni_ui.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/showcase.css" />
    <link href="AeterniUI.Sample.styles.css" rel="stylesheet" />
    <script type="importmap"></script>
</head>

<body>
    <div id="app">
        <div class="sample-boot">
            <span class="sample-boot__ring" aria-hidden="true"></span>
            <span class="sample-boot__label"></span>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
